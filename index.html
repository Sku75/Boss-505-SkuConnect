<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sku505</title>
  <style>
    :root {
      --hintergrund: #000000;
      --schrift: #ffffff;
      --fokus-hintergrund: #ffffff;
      --fokus-schrift: #000000;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--hintergrund);
      color: var(--schrift);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 22px;
      padding: 12px 12px 60px 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: normal;
      padding: 4px 8px;
      border-bottom: 1px solid var(--schrift);
      margin-bottom: 8px;
    }
    #baum, #baum ul { list-style: none; }
    #baum ul { padding-left: 28px; }
    .eintrag > .zeile {
      display: block;
      padding: 6px 8px;
      cursor: default;
      white-space: nowrap;
    }
    .eintrag:focus { outline: none; }
    .eintrag:focus > .zeile {
      background: var(--fokus-hintergrund);
      color: var(--fokus-schrift);
    }
    #statuszeile {
      position: fixed;
      left: 12px; right: 12px; bottom: 8px;
      padding: 6px 8px;
      border-top: 1px solid var(--schrift);
      font-size: 20px;
      min-height: 34px;
      background: var(--hintergrund);
    }
    #eingabefeld {
      position: fixed;
      left: 12px; right: 12px; top: 50%;
      padding: 10px;
      font-size: 24px;
      background: #000; color: #fff;
      border: 2px solid #fff;
    }
    #eingabefeld[hidden] { display: none; }

    /* Tooltip: Shift halten und Pfeil runter. Zeigt das letzte Ergebnis
       oder die möglichen Werte, Zeile für Zeile. */
    #tooltip {
      position: fixed;
      left: 40px; right: 40px; top: 25%;
      max-height: 50%;
      overflow-y: auto;
      background: #000;
      border: 2px solid #fff;
      padding: 8px;
      list-style: none;
    }
    #tooltip[hidden] { display: none; }
    #tooltip li {
      padding: 6px 8px;
      white-space: nowrap;
    }
    #tooltip li:focus {
      outline: none;
      background: var(--fokus-hintergrund);
      color: var(--fokus-schrift);
    }
    #tooltip .kopf {
      border-bottom: 1px solid #fff;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1 id="titel">Sku505</h1>
  <ul id="baum" role="application" aria-label="Sku505 Menü"></ul>
  <input id="eingabefeld" type="text" hidden aria-label="Eingabe, Enter bestätigt, Escape bricht ab">
  <ul id="tooltip" hidden aria-label="Weitere Angaben"></ul>
  <div id="statuszeile" role="status" aria-live="polite"></div>
  <script src="felder.js"></script>
  <script src="live.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
